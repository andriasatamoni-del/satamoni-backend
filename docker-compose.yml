services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: satamoni
      POSTGRES_USER: satamoni
      POSTGRES_PASSWORD: satamoni
    volumes:
      - satamoni_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satamoni"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://satamoni:satamoni@db:5432/satamoni
      JWT_SECRET: local-dev-secret-change-me
      PORT: 4000
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@satamoni.local
      ADMIN_PASSWORD: admin12345
    ports:
      - "4000:4000"

  # مزامنة اختيارية مع سيرفر مركزي أونلاين (لو الفرع ده عنده واحد).
  # سيبها زي ما هي (فاضية) لو مش محتاج مزامنة - هتشتغل مرة وتقفل نفسها من غير أي تأثير.
  # لتفعيلها: املأ الثلاث قيم دول من صفحة إعدادات السيرفر المركزي، وشغّل:
  #   docker compose up sync -d
  sync:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://satamoni:satamoni@db:5432/satamoni
      CENTRAL_SYNC_URL: ""
      SYNC_API_KEY: ""
      CENTRAL_BRANCH_ID: ""
      SYNC_INTERVAL_SECONDS: "300"
    command: ["node", "db/sync-worker.js"]
    restart: "no"

volumes:
  satamoni_pgdata:
