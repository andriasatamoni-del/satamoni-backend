<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>try{if(localStorage.getItem("satamoni-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ستاموني — دورة حياة الدليفري</title>
<style>
  :root {
    --bg: #FFFFFF; --bg-alt: #F4F1EA; --card: #FFFFFF; --border: #E3DDD0; --ink: #221E17; --faint: #6E6459; --red: #C22A24; --gold: #A87C1F; --gold-bright: #8A5F16; --green: #2F7A3D; --orange: #A8600F; --line: #E7E1D5; --err: #B3261E;
  }
  :root[data-theme="dark"] {
    --bg: #0E0E10; --bg-alt: #18181B; --card: #1D1D20; --border: #2E2C27; --ink: #F4EFE4; --faint: #9C948A; --red: #C22A24; --gold: #CBA135; --gold-bright: #E8C468; --green: #3FA34D; --orange: #D98E2E; --line: #2A2A2E; --err: #F08A83;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; }
  #topbar {
    height: 56px; background: var(--bg-alt); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  }
  #topbar .brand { font-weight: 800; color: var(--gold-bright); font-size: 17px; }
  #userInfo { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  #logoutBtn { background: transparent; border: 1px solid var(--line); color: var(--faint); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

  #main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

  #filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  #filters select {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .tab { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--faint); cursor: pointer; font-weight: 700; font-size: 12px; }
  .tab.active { background: var(--red); color: #fff; border-color: var(--red); }
  /* المرحلة 7L: صف تبويبات نوع الطلب (تيك أواي/دليفري/صالة/طلبات) تحت صف الفلاتر الأساسي */
  #typeFilters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  #typeFilters .tab.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  #refreshBtn { margin-right: auto; background: transparent; border: 1px solid var(--gold); color: var(--gold-bright); border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 12px; }

  #ordersList { display: flex; flex-direction: column; gap: 10px; }
  .order-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .order-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .order-card .oid { font-weight: 800; color: var(--gold-bright); }
  .order-card .meta { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .badge.preparing { background: rgba(217,142,46,.15); color: var(--orange); }
  .badge.out_for_delivery { background: rgba(203,161,53,.15); color: var(--gold-bright); }
  .badge.completed { background: rgba(63,163,77,.15); color: var(--green); }
  .badge.cancelled { background: rgba(194,42,36,.15); color: var(--err); }
  .badge.collected { background: rgba(63,163,77,.15); color: var(--green); }
  .badge.pending_collection { background: rgba(194,42,36,.15); color: var(--err); }
  .order-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .order-card button { border: 1px solid var(--line); background: var(--bg-alt); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 12px; font-weight: 700; }
  .order-card button.primary { border-color: var(--gold); color: var(--gold-bright); }
  .order-card button.danger { border-color: var(--red); color: var(--err); }
  .order-card .items { font-size: 12px; color: var(--faint); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .order-card .log { font-size: 11px; color: var(--faint); margin-top: 6px; }
  #emptyState { text-align: center; color: var(--faint); padding: 60px 20px; }

  #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 60; }
  #loginOverlay.hidden { display: none; }
  #loginBox { width: 320px; text-align: center; }
  #loginBox h1 { color: var(--gold-bright); margin-bottom: 24px; }
  #loginBox input { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 10px; }
  #loginBox button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 6px; }
  #loginErr { color: var(--err); font-size: 12px; margin-top: 10px; min-height: 16px; }

  #pinModalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 65; }
  #pinModalOverlay.show { display: flex; }
  #pinModalBox { background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 20px; width: 300px; text-align: center; }
  #pinModalBox h3 { color: var(--gold-bright); margin: 0 0 10px; font-size: 15px; }
  #pinModalBox input { width: 100%; background: var(--bg-alt); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 12px; font-size: 16px; text-align: center; margin-bottom: 8px; }
  #pinModalBox button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 6px; }
  #pinModalBox button#pinModalCancel { background: transparent; border: 1px solid var(--line); color: var(--faint); font-weight: 700; }

  #editModalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 65; }
  #editModalOverlay.show { display: flex; }
  #editModalBox { background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 20px; width: 420px; max-width: 92vw; max-height: 85vh; overflow-y: auto; }
  #editModalBox h3 { color: var(--gold-bright); margin: 0 0 14px; font-size: 16px; }
  .edit-field { margin-bottom: 10px; }
  .edit-field label { display: block; font-size: 12px; color: var(--faint); margin-bottom: 4px; }
  .edit-field input, .edit-field select { width: 100%; background: var(--bg-alt); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  #editAddRow { display: flex; gap: 6px; }
  #editAddRow select { flex: 1; }
  #editAddRow button { border: 1px solid var(--gold); background: transparent; color: var(--gold-bright); border-radius: 6px; padding: 0 12px; cursor: pointer; font-weight: 700; }
  #editItemsList { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 10px 0; padding: 6px 0; min-height: 40px; }
  .edit-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .edit-item-row:last-child { border-bottom: none; }
  .edit-item-row .n { flex: 1; font-size: 13px; }
  .edit-item-row .n .mods { font-size: 11px; color: var(--gold-bright); }
  .edit-item-row .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .edit-item-row .qty-ctrl button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg-alt); color: var(--ink); cursor: pointer; font-size: 14px; }
  .edit-item-row .lt { font-family: 'Courier New', monospace; color: var(--gold-bright); font-size: 12px; min-width: 55px; text-align: left; }
  .edit-item-row .rm { border: none; background: transparent; color: var(--err); cursor: pointer; font-size: 14px; }
  #editTotalsRow { text-align: left; font-weight: 800; color: var(--gold-bright); margin-bottom: 10px; }
  #editErr { color: var(--err); font-size: 12px; margin-bottom: 8px; min-height: 16px; }
  #editSaveBtn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; }
  #editSaveBtn:disabled { background: #3A3630; cursor: not-allowed; }
  #editCancelBtn { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--faint); cursor: pointer; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">🛵 ستاموني — دورة حياة الدليفري</div>
  <div id="userInfo">
    <span id="userName"></span>
    <button id="themeToggleBtn" title="الوضع الليلي" style="background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700">🌙</button>
    <button id="logoutBtn">خروج</button>
  </div>
</div>

<div id="loginOverlay">
  <div id="loginBox">
    <h1>🛵 تسجيل الدخول</h1>
    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" />
    <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button id="loginBtn">دخول</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="accessDenied" style="display:none;padding:60px 20px;text-align:center;color:var(--faint)">الحساب ده مالوش صلاحية على شاشة الدليفري.</div>

<div id="main" style="display:none">
  <div id="filters">
    <div class="tab active" data-status="">الكل</div>
    <div class="tab" data-status="preparing">تحت التحضير</div>
    <div class="tab" data-status="out_for_delivery">في الطريق</div>
    <div class="tab" data-status="completed">مكتملة</div>
    <div class="tab" data-status="cancelled">ملغاة</div>
    <select id="branchSelect"><option value="">كل الفروع</option></select>
    <select id="paymentSelect">
      <option value="">كل حالات التحصيل</option>
      <option value="pending_collection">تحت التحصيل</option>
      <option value="collected">محصّل</option>
    </select>
    <button id="refreshBtn">تحديث</button>
  </div>
  <!-- المرحلة 7L: فصل تيك أواي عن دليفري (وباقي الأنواع) في شاشة متابعة الطلبات -->
  <div id="typeFilters">
    <div class="tab active" data-otype="">كل الأنواع</div>
    <div class="tab" data-otype="takeaway">تيك أواي</div>
    <div class="tab" data-otype="delivery">دليفري</div>
    <div class="tab" data-otype="dinein">صالة</div>
    <div class="tab" data-otype="talabat">طلبات 🛵</div>
  </div>
  <div id="ordersList"></div>
  <div id="emptyState" style="display:none">مفيش طلبات مطابقة</div>
</div>

<div id="pinModalOverlay">
  <div id="pinModalBox">
    <h3>موافقة مدير الفرع/الأدمن</h3>
    <div id="pinModalMsg" style="font-size:12px;color:var(--faint);margin-bottom:10px"></div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" />
    <div id="pinModalErr" style="color:var(--err);font-size:12px;margin-bottom:8px;min-height:16px"></div>
    <button id="pinModalSubmit">تأكيد</button>
    <button id="pinModalCancel">إلغاء</button>
  </div>
</div>

<div id="editModalOverlay">
  <div id="editModalBox">
    <h3>تعديل الطلب #<span id="editOrderId"></span></h3>
    <div class="edit-field">
      <label>العنوان</label>
      <input id="editAddressInput" placeholder="تفاصيل العنوان" />
    </div>
    <div class="edit-field">
      <label>إضافة صنف</label>
      <div id="editAddRow">
        <select id="editAddItemSelect"></select>
        <button id="editAddItemBtn" type="button">+ إضافة</button>
      </div>
    </div>
    <div id="editItemsList"></div>
    <div id="editTotalsRow"></div>
    <div id="editErr"></div>
    <button id="editSaveBtn">حفظ التعديل</button>
    <button id="editCancelBtn">إلغاء</button>
  </div>
</div>

<script src="/js/print-tickets.js"></script>
<script>
const API_BASE_URL = window.SATAMONI_API_URL || (location.protocol.startsWith("http") ? "" : "http://localhost:4000");

const auth = {
  token: sessionStorage.getItem("satamoni_token") || null,
  user: JSON.parse(sessionStorage.getItem("satamoni_user") || "null"),
};
if (auth.user && auth.user.role === "cashier") location.replace("satamoni-pos.html");
if (auth.user && auth.user.role === "callcenter") location.replace("satamoni-callcenter.html");

const state = { status: "", branchId: "", paymentStatus: "", orderType: "", branches: [], paymentMethods: [] };

// المرحلة 8.22: القايمة دي كانت متفحوصة وقت تسجيل الدخول بس (لو حد سجل دخول من غير صلاحية من الفورم
// ده بالظبط) - لكن مش وقت استعادة جلسة موجودة فعلًا (زي سائق مسجل دخول من صفحة تانية وفاتح الرابط
// ده مباشرة) - كانت شاشة الدليفري بالكامل (بيانات عملاء، تحصيل نقدي، استرجاع) بتفتح له من غير فحص.
const allowedRoles = ["admin", "callcenter", "branch_manager", "cashier", "accountant"];

function showLogin() { document.getElementById("loginOverlay").classList.remove("hidden"); }
function hideLogin() { document.getElementById("loginOverlay").classList.add("hidden"); }
function setSession(token, user) {
  auth.token = token; auth.user = user;
  sessionStorage.setItem("satamoni_token", token);
  sessionStorage.setItem("satamoni_user", JSON.stringify(user));
  document.getElementById("userName").textContent = `${user.name} (${user.role})`;
}
function clearSession() {
  auth.token = null; auth.user = null;
  sessionStorage.removeItem("satamoni_token");
  sessionStorage.removeItem("satamoni_user");
}

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(auth.token ? { Authorization: `Bearer ${auth.token}` } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401) { clearSession(); showLogin(); throw new Error("انتهت الجلسة، سجل دخول تاني"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "حصل خطأ");
  return data;
}

// المرحلة 7F: سائقين مسجّلين فعليًا بدل الاسم الحر - بيتحمّلوا مرة واحدة لكل فرع ويتخزّنوا هنا
const driversCache = {};
async function driversForBranch(branchId) {
  if (!driversCache[branchId]) {
    try { driversCache[branchId] = await api(`/api/drivers?branchId=${branchId}`); }
    catch (e) { driversCache[branchId] = []; }
  }
  return driversCache[branchId];
}

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginErr");
  errBox.textContent = "";
  try {
    const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    if (!allowedRoles.includes(data.user.role)) {
      errBox.textContent = "الحساب ده مالوش صلاحية على شاشة الدليفري";
      return;
    }
    setSession(data.token, data.user);
    hideLogin();
    boot();
  } catch (e) { errBox.textContent = e.message; }
};
document.getElementById("logoutBtn").onclick = () => { clearSession(); location.reload(); };

async function boot() {
  document.getElementById("main").style.display = "block";
  try {
    const branches = await api("/api/branches");
    state.branches = branches;
    const sel = document.getElementById("branchSelect");
    sel.innerHTML = `<option value="">كل الفروع</option>` + branches.map(b => `<option value="${b.id}">${b.name}</option>`).join("");
    if (auth.user.role === "cashier" || auth.user.role === "branch_manager") {
      sel.value = auth.user.branchId || "";
      sel.disabled = true;
      state.branchId = auth.user.branchId || "";
    }
  } catch (e) { /* بعض الأدوار ممكن ميكونش عندها صلاحية GET /api/branches بدون توكن، لكن هنا متسجلين دخول فهتنجح غالبًا */ }
  try {
    const cfg = await api("/api/config");
    state.paymentMethods = cfg.paymentMethods || [];
  } catch (e) { /* الإيصال هيعرض "-" مكان طريقة الدفع لو الإعدادات مش متاحة، مش مانع من عرض باقي التذكرة */ }
  await loadOrders();
}

document.querySelectorAll("#filters .tab[data-status]").forEach(tab => {
  tab.onclick = () => {
    state.status = tab.dataset.status;
    document.querySelectorAll("#filters .tab[data-status]").forEach(t => t.classList.toggle("active", t === tab));
    loadOrders();
  };
});
// المرحلة 7L: فصل تيك أواي عن دليفري (وباقي الأنواع) - صف تبويبات منفصل، مستقل عن فلتر الحالة
document.querySelectorAll("#typeFilters .tab[data-otype]").forEach(tab => {
  tab.onclick = () => {
    state.orderType = tab.dataset.otype;
    document.querySelectorAll("#typeFilters .tab[data-otype]").forEach(t => t.classList.toggle("active", t === tab));
    loadOrders();
  };
});
document.getElementById("branchSelect").onchange = (e) => { state.branchId = e.target.value; loadOrders(); };
document.getElementById("paymentSelect").onchange = (e) => { state.paymentStatus = e.target.value; loadOrders(); };
document.getElementById("refreshBtn").onclick = loadOrders;

const statusLabels = { preparing: "تحت التحضير", out_for_delivery: "في الطريق", completed: "مكتملة", cancelled: "ملغاة" };
const paymentLabels = { collected: "محصّل", pending_collection: "تحت التحصيل" };
const orderTypeLabels = { delivery: "دليفري", takeaway: "تيك أواي", dinein: "صالة", talabat: "طلبات" };
const money = (n) => `${n} ج.م`;

async function loadOrders() {
  try {
    const qs = new URLSearchParams();
    if (state.status) qs.set("status", state.status);
    if (state.branchId) qs.set("branchId", state.branchId);
    if (state.paymentStatus) qs.set("paymentStatus", state.paymentStatus);
    if (state.orderType) qs.set("orderType", state.orderType);
    const orders = await api(`/api/orders?${qs.toString()}`);
    renderOrders(orders);
  } catch (e) {
    document.getElementById("ordersList").innerHTML = "";
    document.getElementById("emptyState").style.display = "block";
    document.getElementById("emptyState").textContent = e.message;
  }
}

function branchName(id) {
  const b = state.branches.find(b => String(b.id) === String(id));
  return b ? b.name : "—";
}

function renderOrders(orders) {
  const list = document.getElementById("ordersList");
  const empty = document.getElementById("emptyState");
  if (orders.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = "مفيش طلبات مطابقة";
    return;
  }
  empty.style.display = "none";
  list.innerHTML = orders.map(o => `
    <div class="order-card" data-id="${o.id}">
      <div class="head">
        <span class="oid">#${o.id} — ${orderTypeLabels[o.order_type] || o.order_type} — ${branchName(o.branch_id)}</span>
        <span>
          <span class="badge ${o.status}">${statusLabels[o.status] || o.status}${o.voided ? " (استرجاع)" : ""}</span>
          <span class="badge ${o.payment_status}">${paymentLabels[o.payment_status] || o.payment_status}</span>
        </span>
      </div>
      <div class="meta">${o.customer_name || "بدون اسم"} — ${o.customer_phone || "—"}${o.address_details ? " — " + o.address_details : ""}</div>
      ${o.driver_name ? `<div class="meta">🛵 الطيار: ${o.driver_name}</div>` : ""}
      ${o.voided ? `<div class="meta" style="color:var(--err)">🗑️ استرجاع: ${o.void_reason || "—"}</div>` : ""}
      <div class="meta">الإجمالي: ${money(o.total)} — ${new Date(o.created_at).toLocaleString("ar-EG")}</div>
      <div class="actions" data-actions></div>
      <div class="items" data-detail style="display:none"></div>
    </div>
  `).join("");

  list.querySelectorAll(".order-card").forEach(card => {
    const id = card.dataset.id;
    const order = orders.find(o => String(o.id) === id);
    renderActions(card, order);
    card.querySelector(".head").style.cursor = "pointer";
    card.querySelector(".head").onclick = () => toggleDetail(card, order);
  });
}

function renderActions(card, order) {
  const wrap = card.querySelector("[data-actions]");
  const btns = [];
  if (order.status === "preparing") {
    btns.push(`<button class="primary" data-act="ticket">🖨️ تذكرة المطبخ</button>`);
    btns.push(`<button data-act="edit">✏️ تعديل</button>`);
    if (order.order_type === "delivery") btns.push(`<button class="primary" data-act="dispatch">🛵 خروج مع الطيار</button>`);
    else btns.push(`<button class="primary" data-act="complete">✅ اتسلم</button>`);
    btns.push(`<button class="danger" data-act="cancel">❌ إلغاء</button>`);
  } else if (order.status === "out_for_delivery") {
    btns.push(`<button class="primary" data-act="complete">✅ رجع الطيار / اتسلم</button>`);
    if (order.order_type === "delivery" && order.dispatch_status === "OUT_FOR_DELIVERY") {
      btns.push(`<button data-act="failed">⚠️ فشل التسليم</button>`);
    }
    btns.push(`<button class="danger" data-act="cancel">❌ إلغاء</button>`);
  }
  if (order.payment_status === "pending_collection" && order.status !== "cancelled") {
    btns.push(`<button data-act="collect">💰 تأكيد التحصيل</button>`);
  }
  if (order.status === "completed" && !order.voided) {
    btns.push(`<button class="danger" data-act="void">🗑️ استرجاع (Void)</button>`);
  }
  if (order.status !== "cancelled") {
    btns.push(`<button data-act="receipt">🧾 إيصال</button>`);
  }
  wrap.innerHTML = btns.join("");
  wrap.querySelectorAll("button").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); handleAction(order, btn.dataset.act); };
  });
}

async function handleAction(order, act) {
  try {
    if (act === "ticket") {
      SatamoniPrint.printKitchenTicket(order, api, { orderTypeLabel: orderTypeLabels[order.order_type], branchLabel: branchName(order.branch_id) });
      return;
    }
    if (act === "receipt") {
      const pm = state.paymentMethods.find(p => p.id === order.payment_method_id);
      SatamoniPrint.printCashierReceipt(order, api, {
        orderTypeLabel: orderTypeLabels[order.order_type],
        branchLabel: branchName(order.branch_id),
        paymentMethodLabel: pm?.name,
      });
      return;
    }
    if (act === "edit") { openEditModal(order); return; }
    if (act === "dispatch") {
      // المرحلة 7F: سائق مسجّل فعليًا بدل اسم حر - تعيين + خروج للتوصيل في خطوة واحدة (نفس تجربة
      // الاستخدام القديمة، بس دلوقتي مرتبط بسجل سائق حقيقي قابل للمساءلة عن الكاش وقت التسليم)
      const drivers = await driversForBranch(order.branch_id);
      if (drivers.length === 0) {
        alert("مفيش سائقين مسجّلين لفرع الطلب ده - سجّلهم الأول من شاشة إدارة السائقين");
        return;
      }
      const listText = drivers.map((d, i) => `${i + 1}) ${d.name}${d.phone ? " - " + d.phone : ""}`).join("\n");
      const choice = prompt(`اختار رقم السائق:\n${listText}`);
      if (!choice) return;
      const idx = Number(choice) - 1;
      if (!Number.isInteger(idx) || !drivers[idx]) { alert("اختيار غير صحيح"); return; }
      await api(`/api/deliveries/${order.id}/assign`, { method: "POST", body: JSON.stringify({ driverId: drivers[idx].id }) });
      await api(`/api/deliveries/${order.id}/out-for-delivery`, { method: "POST" });
    } else if (act === "complete") {
      // المرحلة 7F: طلب دليفري في الطريق بيتسلّم عن طريق محرك التوصيل (بيسجّل الكاش المحصّل ويرحّل
      // قيده المحاسبي) - أي طلب تاني (تيك أواي/صالة) يفضل زي ما هو بالظبط، مفيش داعي لمحرك التوصيل
      if (order.order_type === "delivery" && order.dispatch_status === "OUT_FOR_DELIVERY") {
        let body = {};
        if (order.payment_status === "pending_collection") {
          const input = prompt(`المبلغ اللي الطيار حصّله فعليًا من العميل (الإجمالي ${order.total} ج.م):`, order.total);
          if (input === null) return;
          body = { collectedAmount: Number(input) };
        }
        await api(`/api/deliveries/${order.id}/delivered`, { method: "POST", body: JSON.stringify(body) });
      } else {
        await api(`/api/orders/${order.id}/status`, { method: "PATCH", body: JSON.stringify({ status: "completed" }) });
      }
    } else if (act === "failed") {
      const reasons = [
        ["CUSTOMER_UNREACHABLE", "العميل مش رادّ"], ["CUSTOMER_REFUSED", "العميل رفض الاستلام"],
        ["WRONG_ADDRESS", "العنوان غلط"], ["CLOSED_LOCATION", "المكان مقفول"], ["OTHER", "سبب تاني"],
      ];
      const listText = reasons.map((r, i) => `${i + 1}) ${r[1]}`).join("\n");
      const choice = prompt(`سبب فشل تسليم الطلب #${order.id}:\n${listText}`);
      if (!choice) return;
      const idx = Number(choice) - 1;
      if (!Number.isInteger(idx) || !reasons[idx]) { alert("اختيار غير صحيح"); return; }
      await api(`/api/deliveries/${order.id}/failed`, { method: "POST", body: JSON.stringify({ reason: reasons[idx][0] }) });
      alert("اتسجّل فشل التسليم. لما الطيار يرجع الفرع، استخدم زرار الاسترجاع (Void) لو الطلب هيتلغي، أو أعد الجدولة من شاشة لوحة التوزيع لو هيتسلّم تاني.");
    } else if (act === "cancel") {
      if (!confirm(`متأكد من إلغاء الطلب #${order.id}؟`)) return;
      await api(`/api/orders/${order.id}/status`, { method: "PATCH", body: JSON.stringify({ status: "cancelled" }) });
    } else if (act === "collect") {
      await api(`/api/orders/${order.id}/payment-status`, { method: "PATCH", body: JSON.stringify({ paymentStatus: "collected" }) });
    } else if (act === "void") {
      const reason = prompt(`سبب استرجاع الطلب #${order.id} (Void):`);
      if (!reason) return;
      let approverId = null;
      if (auth.user.role !== "admin" && auth.user.role !== "branch_manager") {
        const approval = await openPinModal("استرجاع الطلب محتاج موافقة مدير الفرع أو الأدمن - دخّل الـ PIN:", order.branch_id);
        if (!approval) return;
        approverId = approval.approverId;
      }
      await api(`/api/orders/${order.id}/void`, { method: "POST", body: JSON.stringify({ reason, approverId }) });
    }
    loadOrders();
  } catch (e) { alert(e.message); }
}

// ---------------- مودال موافقة PIN (استرجاع الطلبات) ----------------
let pinModalResolve = null;
let pinModalBranchId = null;
function openPinModal(msg, branchId) {
  pinModalBranchId = branchId || null;
  document.getElementById("pinModalMsg").textContent = msg;
  document.getElementById("pinInput").value = "";
  document.getElementById("pinModalErr").textContent = "";
  document.getElementById("pinModalOverlay").classList.add("show");
  document.getElementById("pinInput").focus();
  return new Promise((resolve) => { pinModalResolve = resolve; });
}
function closePinModal(result) {
  document.getElementById("pinModalOverlay").classList.remove("show");
  if (pinModalResolve) { pinModalResolve(result); pinModalResolve = null; }
}
document.getElementById("pinModalCancel").onclick = () => closePinModal(null);
document.getElementById("pinModalSubmit").onclick = async () => {
  const pin = document.getElementById("pinInput").value.trim();
  const errBox = document.getElementById("pinModalErr");
  errBox.textContent = "";
  if (!pin) { errBox.textContent = "دخّل الـ PIN"; return; }
  const btn = document.getElementById("pinModalSubmit");
  btn.disabled = true;
  try {
    const data = await api("/api/auth/verify-override-pin", {
      method: "POST",
      body: JSON.stringify({ pin, branchId: pinModalBranchId }),
    });
    closePinModal(data);
  } catch (e) {
    errBox.textContent = e.message || "PIN غير صحيح";
  } finally {
    btn.disabled = false;
  }
};

// ---------------- تعديل طلب تحت التحضير (PUT /api/orders/:id) ----------------
let editState = null;
let menuFullCache = null;

async function ensureMenuLoaded() {
  if (!menuFullCache) {
    const data = await api("/api/config/full");
    menuFullCache = data.menu;
  }
  return menuFullCache;
}

function editLineTotal(it) { return Number(it.unitPrice) * it.qty; }

async function openEditModal(order) {
  try {
    const full = await api(`/api/orders/${order.id}`);
    await ensureMenuLoaded();
    editState = {
      order: full,
      items: full.items.map(it => ({
        itemId: it.item_id, variantId: it.variant_id, comboId: it.combo_id,
        name: it.item_name || it.combo_name || "صنف", label: it.variant_label || "",
        unitPrice: Number(it.unit_price), qty: it.quantity,
        // مرفقات الصنف الأصلية (unit_price فوق أصلًا شامل سعرها) - بتفضل معاه طالما الكمية بس اتغيّرت،
        // مش قابلة للتعديل من الشاشة دي (لو الموظف عايز يغيّرها يشيل الصنف ويضيفه تاني من غير مرفقات)
        modifiers: (it.modifiers || []).map(m => ({ id: m.modifier_id, name: m.name_at_sale })),
      })),
    };
    document.getElementById("editOrderId").textContent = order.id;
    document.getElementById("editAddressInput").value = full.address_details || "";
    document.getElementById("editErr").textContent = "";
    renderEditAddItemOptions();
    renderEditItems();
    document.getElementById("editModalOverlay").classList.add("show");
  } catch (e) { alert(e.message); }
}

function renderEditAddItemOptions() {
  const sel = document.getElementById("editAddItemSelect");
  const opts = [];
  menuFullCache.forEach(mi => {
    (mi.variants || []).forEach(v => {
      opts.push(`<option value="${mi.id}__${v.id}">${mi.name}${v.label ? " (" + v.label + ")" : ""} — ${money(v.price)}</option>`);
    });
  });
  sel.innerHTML = opts.join("");
}

function renderEditItems() {
  const wrap = document.getElementById("editItemsList");
  if (editState.items.length === 0) {
    wrap.innerHTML = `<div style="color:var(--faint);text-align:center;padding:10px;font-size:12px">مفيش أصناف - لازم تسيب صنف واحد على الأقل</div>`;
  } else {
    wrap.innerHTML = editState.items.map((it, idx) => `
      <div class="edit-item-row" data-idx="${idx}">
        <div class="n">${it.name}${it.label ? " (" + it.label + ")" : ""}${it.modifiers.length ? "<br/><span class='mods'>+ " + it.modifiers.map(m => m.name).join("، ") + "</span>" : ""}</div>
        <div class="qty-ctrl"><button data-d="-1">−</button><span>${it.qty}</span><button data-d="1">+</button></div>
        <div class="lt">${money(editLineTotal(it))}</div>
        <button class="rm" data-rm="1" title="حذف الصنف">🗑️</button>
      </div>`).join("");
    wrap.querySelectorAll(".edit-item-row").forEach(row => {
      const idx = Number(row.dataset.idx);
      row.querySelectorAll(".qty-ctrl button").forEach(btn => {
        btn.onclick = () => changeEditQty(idx, Number(btn.dataset.d));
      });
      row.querySelector(".rm").onclick = () => { editState.items.splice(idx, 1); renderEditItems(); };
    });
  }
  const subtotal = editState.items.reduce((s, it) => s + editLineTotal(it), 0);
  const deliveryFee = Number(editState.order.delivery_fee);
  const discount = Number(editState.order.discount);
  const total = Math.max(subtotal + deliveryFee - discount, 0);
  document.getElementById("editTotalsRow").textContent =
    `الفرعي ${money(subtotal)} + التوصيل ${money(deliveryFee)}${discount > 0 ? " - خصم " + money(discount) : ""} = الإجمالي ${money(total)}`;
}

function changeEditQty(idx, delta) {
  const it = editState.items[idx];
  it.qty += delta;
  if (it.qty <= 0) editState.items.splice(idx, 1);
  renderEditItems();
}

document.getElementById("editAddItemBtn").onclick = () => {
  const sel = document.getElementById("editAddItemSelect");
  if (!sel.value) return;
  const [itemIdStr, variantIdStr] = sel.value.split("__");
  const itemId = Number(itemIdStr), variantId = Number(variantIdStr);
  const mi = menuFullCache.find(m => m.id === itemId);
  const v = mi.variants.find(v => v.id === variantId);
  const existing = editState.items.find(it => it.itemId === itemId && it.variantId === variantId && it.modifiers.length === 0);
  if (existing) existing.qty += 1;
  else editState.items.push({ itemId, variantId, comboId: null, name: mi.name, label: v.label, unitPrice: Number(v.price), qty: 1, modifiers: [] });
  renderEditItems();
};

document.getElementById("editCancelBtn").onclick = () => {
  document.getElementById("editModalOverlay").classList.remove("show");
  editState = null;
};

document.getElementById("editSaveBtn").onclick = async () => {
  const errBox = document.getElementById("editErr");
  errBox.textContent = "";
  if (!editState || editState.items.length === 0) { errBox.textContent = "لازم صنف واحد على الأقل"; return; }
  const btn = document.getElementById("editSaveBtn");
  btn.disabled = true;
  try {
    const o = editState.order;
    const payload = {
      deliveryAreaId: o.delivery_area_id,
      addressDetails: document.getElementById("editAddressInput").value.trim(),
      customerName: o.customer_name,
      customerPhone: o.customer_phone,
      paymentMethodId: o.payment_method_id,
      tableNumber: o.table_number,
      deliveryFee: Number(o.delivery_fee),
      discount: Number(o.discount),
      items: editState.items.map(it => it.comboId
        ? { comboId: it.comboId, quantity: it.qty }
        : { itemId: it.itemId, variantId: it.variantId, quantity: it.qty, modifiers: it.modifiers.map(m => ({ id: m.id })) }),
    };
    await api(`/api/orders/${o.id}`, { method: "PUT", body: JSON.stringify(payload) });
    document.getElementById("editModalOverlay").classList.remove("show");
    editState = null;
    loadOrders();
  } catch (e) {
    errBox.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
};

async function toggleDetail(card, order) {
  const box = card.querySelector("[data-detail]");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.innerHTML = "...جاري التحميل";
  box.style.display = "block";
  try {
    const full = await api(`/api/orders/${order.id}`);
    box.innerHTML = `
      <div>${full.items.map(it => `${it.item_name || it.combo_name || "صنف"} ${it.variant_label ? "(" + it.variant_label + ")" : ""} × ${it.quantity} — ${money(it.line_total)}`).join("<br/>")}</div>
      <div class="log">${full.statusLog.map(l => `${new Date(l.changed_at).toLocaleString("ar-EG")} — ${statusLabels[l.status] || l.status}${l.notes ? " (" + l.notes + ")" : ""}${l.changed_by_name ? " — " + l.changed_by_name : ""}`).join("<br/>")}</div>
    `;
  } catch (e) { box.innerHTML = e.message; }
}


if (auth.token && auth.user) {
  document.getElementById("userName").textContent = `${auth.user.name} (${auth.user.role})`;
  hideLogin();
  if (allowedRoles.includes(auth.user.role)) boot();
  else document.getElementById("accessDenied").style.display = "block";
} else {
  showLogin();
}
