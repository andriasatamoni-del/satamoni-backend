<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ساتاموني — دورة حياة الدليفري</title>
<style>
  :root {
    --bg: #0E0E10; --bg-alt: #18181B; --card: #1D1D20; --border: #2E2C27;
    --ink: #F4EFE4; --faint: #9C948A; --red: #C22A24; --gold: #CBA135;
    --gold-bright: #E8C468; --green: #3FA34D; --orange: #D98E2E; --line: #2A2A2E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 14px; }
  #topbar {
    height: 56px; background: var(--bg-alt); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  }
  #topbar .brand { font-weight: 800; color: var(--gold-bright); font-size: 17px; }
  #userInfo { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  #logoutBtn { background: transparent; border: 1px solid var(--line); color: var(--faint); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

  #main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

  #filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  #filters select {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  .tab { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--faint); cursor: pointer; font-weight: 700; font-size: 12px; }
  .tab.active { background: var(--red); color: #fff; border-color: var(--red); }
  #refreshBtn { margin-right: auto; background: transparent; border: 1px solid var(--gold); color: var(--gold-bright); border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 12px; }

  #ordersList { display: flex; flex-direction: column; gap: 10px; }
  .order-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .order-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .order-card .oid { font-weight: 800; color: var(--gold-bright); }
  .order-card .meta { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .badge.preparing { background: rgba(217,142,46,.15); color: var(--orange); }
  .badge.out_for_delivery { background: rgba(203,161,53,.15); color: var(--gold-bright); }
  .badge.completed { background: rgba(63,163,77,.15); color: var(--green); }
  .badge.cancelled { background: rgba(194,42,36,.15); color: #F08A83; }
  .badge.collected { background: rgba(63,163,77,.15); color: var(--green); }
  .badge.pending_collection { background: rgba(194,42,36,.15); color: #F08A83; }
  .order-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .order-card button { border: 1px solid var(--line); background: var(--bg-alt); color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 12px; font-weight: 700; }
  .order-card button.primary { border-color: var(--gold); color: var(--gold-bright); }
  .order-card button.danger { border-color: var(--red); color: #F08A83; }
  .order-card .items { font-size: 12px; color: var(--faint); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .order-card .log { font-size: 11px; color: var(--faint); margin-top: 6px; }
  #emptyState { text-align: center; color: var(--faint); padding: 60px 20px; }

  #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 60; }
  #loginOverlay.hidden { display: none; }
  #loginBox { width: 320px; text-align: center; }
  #loginBox h1 { color: var(--gold-bright); margin-bottom: 24px; }
  #loginBox input { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 10px; }
  #loginBox button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 6px; }
  #loginErr { color: #F08A83; font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">🛵 ساتاموني — دورة حياة الدليفري</div>
  <div id="userInfo">
    <span id="userName"></span>
    <button id="logoutBtn">خروج</button>
  </div>
</div>

<div id="loginOverlay">
  <div id="loginBox">
    <h1>🛵 تسجيل الدخول</h1>
    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" />
    <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button id="loginBtn">دخول</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="main" style="display:none">
  <div id="filters">
    <div class="tab active" data-status="">الكل</div>
    <div class="tab" data-status="preparing">تحت التحضير</div>
    <div class="tab" data-status="out_for_delivery">في الطريق</div>
    <div class="tab" data-status="completed">مكتملة</div>
    <div class="tab" data-status="cancelled">ملغاة</div>
    <select id="branchSelect"><option value="">كل الفروع</option></select>
    <select id="paymentSelect">
      <option value="">كل حالات التحصيل</option>
      <option value="pending_collection">تحت التحصيل</option>
      <option value="collected">محصّل</option>
    </select>
    <button id="refreshBtn">تحديث</button>
  </div>
  <div id="ordersList"></div>
  <div id="emptyState" style="display:none">مفيش طلبات مطابقة</div>
</div>

<script>
const API_BASE_URL = window.SATAMONI_API_URL || (location.protocol.startsWith("http") ? "" : "http://localhost:4000");

const auth = {
  token: sessionStorage.getItem("satamoni_token") || null,
  user: JSON.parse(sessionStorage.getItem("satamoni_user") || "null"),
};

const state = { status: "", branchId: "", paymentStatus: "", branches: [] };

function showLogin() { document.getElementById("loginOverlay").classList.remove("hidden"); }
function hideLogin() { document.getElementById("loginOverlay").classList.add("hidden"); }
function setSession(token, user) {
  auth.token = token; auth.user = user;
  sessionStorage.setItem("satamoni_token", token);
  sessionStorage.setItem("satamoni_user", JSON.stringify(user));
  document.getElementById("userName").textContent = `${user.name} (${user.role})`;
}
function clearSession() {
  auth.token = null; auth.user = null;
  sessionStorage.removeItem("satamoni_token");
  sessionStorage.removeItem("satamoni_user");
}

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(auth.token ? { Authorization: `Bearer ${auth.token}` } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401) { clearSession(); showLogin(); throw new Error("انتهت الجلسة، سجل دخول تاني"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "حصل خطأ");
  return data;
}

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginErr");
  errBox.textContent = "";
  try {
    const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    const allowed = ["admin", "callcenter", "branch_manager", "cashier", "accountant"];
    if (!allowed.includes(data.user.role)) {
      errBox.textContent = "الحساب ده مالوش صلاحية على شاشة الدليفري";
      return;
    }
    setSession(data.token, data.user);
    hideLogin();
    boot();
  } catch (e) { errBox.textContent = e.message; }
};
document.getElementById("logoutBtn").onclick = () => { clearSession(); location.reload(); };

async function boot() {
  document.getElementById("main").style.display = "block";
  try {
    const branches = await api("/api/branches");
    state.branches = branches;
    const sel = document.getElementById("branchSelect");
    sel.innerHTML = `<option value="">كل الفروع</option>` + branches.map(b => `<option value="${b.id}">${b.name}</option>`).join("");
    if (auth.user.role === "cashier" || auth.user.role === "branch_manager") {
      sel.value = auth.user.branchId || "";
      sel.disabled = true;
      state.branchId = auth.user.branchId || "";
    }
  } catch (e) { /* بعض الأدوار ممكن ميكونش عندها صلاحية GET /api/branches بدون توكن، لكن هنا متسجلين دخول فهتنجح غالبًا */ }
  await loadOrders();
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    state.status = tab.dataset.status;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    loadOrders();
  };
});
document.getElementById("branchSelect").onchange = (e) => { state.branchId = e.target.value; loadOrders(); };
document.getElementById("paymentSelect").onchange = (e) => { state.paymentStatus = e.target.value; loadOrders(); };
document.getElementById("refreshBtn").onclick = loadOrders;

const statusLabels = { preparing: "تحت التحضير", out_for_delivery: "في الطريق", completed: "مكتملة", cancelled: "ملغاة" };
const paymentLabels = { collected: "محصّل", pending_collection: "تحت التحصيل" };
const orderTypeLabels = { delivery: "دليفري", takeaway: "تيك أواي", dinein: "صالة", talabat: "طلبات" };
const money = (n) => `${n} ج.م`;

async function loadOrders() {
  try {
    const qs = new URLSearchParams();
    if (state.status) qs.set("status", state.status);
    if (state.branchId) qs.set("branchId", state.branchId);
    if (state.paymentStatus) qs.set("paymentStatus", state.paymentStatus);
    const orders = await api(`/api/orders?${qs.toString()}`);
    renderOrders(orders);
  } catch (e) {
    document.getElementById("ordersList").innerHTML = "";
    document.getElementById("emptyState").style.display = "block";
    document.getElementById("emptyState").textContent = e.message;
  }
}

function branchName(id) {
  const b = state.branches.find(b => String(b.id) === String(id));
  return b ? b.name : "—";
}

function renderOrders(orders) {
  const list = document.getElementById("ordersList");
  const empty = document.getElementById("emptyState");
  if (orders.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = "مفيش طلبات مطابقة";
    return;
  }
  empty.style.display = "none";
  list.innerHTML = orders.map(o => `
    <div class="order-card" data-id="${o.id}">
      <div class="head">
        <span class="oid">#${o.id} — ${orderTypeLabels[o.order_type] || o.order_type} — ${branchName(o.branch_id)}</span>
        <span>
          <span class="badge ${o.status}">${statusLabels[o.status] || o.status}</span>
          <span class="badge ${o.payment_status}">${paymentLabels[o.payment_status] || o.payment_status}</span>
        </span>
      </div>
      <div class="meta">${o.customer_name || "بدون اسم"} — ${o.customer_phone || "—"}${o.address_details ? " — " + o.address_details : ""}</div>
      ${o.driver_name ? `<div class="meta">🛵 الطيار: ${o.driver_name}</div>` : ""}
      <div class="meta">الإجمالي: ${money(o.total)} — ${new Date(o.created_at).toLocaleString("ar-EG")}</div>
      <div class="actions" data-actions></div>
      <div class="items" data-detail style="display:none"></div>
    </div>
  `).join("");

  list.querySelectorAll(".order-card").forEach(card => {
    const id = card.dataset.id;
    const order = orders.find(o => String(o.id) === id);
    renderActions(card, order);
    card.querySelector(".head").style.cursor = "pointer";
    card.querySelector(".head").onclick = () => toggleDetail(card, order);
  });
}

function renderActions(card, order) {
  const wrap = card.querySelector("[data-actions]");
  const btns = [];
  if (order.status === "preparing") {
    btns.push(`<button class="primary" data-act="ticket">🖨️ تذكرة المطبخ</button>`);
    if (order.order_type === "delivery") btns.push(`<button class="primary" data-act="dispatch">🛵 خروج مع الطيار</button>`);
    else btns.push(`<button class="primary" data-act="complete">✅ اتسلم</button>`);
    btns.push(`<button class="danger" data-act="cancel">❌ إلغاء</button>`);
  } else if (order.status === "out_for_delivery") {
    btns.push(`<button class="primary" data-act="complete">✅ رجع الطيار / اتسلم</button>`);
    btns.push(`<button class="danger" data-act="cancel">❌ إلغاء</button>`);
  }
  if (order.payment_status === "pending_collection" && order.status !== "cancelled") {
    btns.push(`<button data-act="collect">💰 تأكيد التحصيل</button>`);
  }
  wrap.innerHTML = btns.join("");
  wrap.querySelectorAll("button").forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); handleAction(order, btn.dataset.act); };
  });
}

async function handleAction(order, act) {
  try {
    if (act === "ticket") { printKitchenTicket(order); return; }
    if (act === "dispatch") {
      const driverName = prompt("اسم الطيار:");
      if (!driverName) return;
      await api(`/api/orders/${order.id}/status`, { method: "PATCH", body: JSON.stringify({ status: "out_for_delivery", driverName }) });
    } else if (act === "complete") {
      await api(`/api/orders/${order.id}/status`, { method: "PATCH", body: JSON.stringify({ status: "completed" }) });
    } else if (act === "cancel") {
      if (!confirm(`متأكد من إلغاء الطلب #${order.id}؟`)) return;
      await api(`/api/orders/${order.id}/status`, { method: "PATCH", body: JSON.stringify({ status: "cancelled" }) });
    } else if (act === "collect") {
      await api(`/api/orders/${order.id}/payment-status`, { method: "PATCH", body: JSON.stringify({ paymentStatus: "collected" }) });
    }
    loadOrders();
  } catch (e) { alert(e.message); }
}

async function toggleDetail(card, order) {
  const box = card.querySelector("[data-detail]");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.innerHTML = "...جاري التحميل";
  box.style.display = "block";
  try {
    const full = await api(`/api/orders/${order.id}`);
    box.innerHTML = `
      <div>${full.items.map(it => `${it.item_name || it.combo_name || "صنف"} ${it.variant_label ? "(" + it.variant_label + ")" : ""} × ${it.quantity} — ${money(it.line_total)}`).join("<br/>")}</div>
      <div class="log">${full.statusLog.map(l => `${new Date(l.changed_at).toLocaleString("ar-EG")} — ${statusLabels[l.status] || l.status}${l.notes ? " (" + l.notes + ")" : ""}${l.changed_by_name ? " — " + l.changed_by_name : ""}`).join("<br/>")}</div>
    `;
  } catch (e) { box.innerHTML = e.message; }
}

function printKitchenTicket(order) {
  const win = window.open("", "_blank", "width=380,height=600");
  win.document.write(`
    <html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>تذكرة تحضير #${order.id}</title>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; padding: 16px; }
      h2 { margin: 0 0 4px; }
      .meta { font-size: 13px; color: #444; margin-bottom: 10px; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 6px 0; border-bottom: 1px dashed #999; font-size: 15px; }
    </style></head><body>
    <h2>طلب #${order.id} — ${orderTypeLabels[order.order_type] || order.order_type}</h2>
    <div class="meta">${branchName(order.branch_id)} — ${new Date(order.created_at).toLocaleString("ar-EG")}</div>
    <div class="meta">العميل: ${order.customer_name || "—"} — ${order.customer_phone || "—"}</div>
    ${order.address_details ? `<div class="meta">العنوان: ${order.address_details}</div>` : ""}
    <table>جاري التحميل...</table>
    <script>window.onload = () => window.print();<\/script>
    </body></html>
  `);
  win.document.close();
  api(`/api/orders/${order.id}`).then(full => {
    const rows = full.items.map(it =>
      `<tr><td>${it.item_name || it.combo_name || "صنف"} ${it.variant_label ? "(" + it.variant_label + ")" : ""}</td><td>× ${it.quantity}</td></tr>`
    ).join("");
    win.document.querySelector("table").innerHTML = rows;
  });
}

if (auth.token && auth.user) {
  document.getElementById("userName").textContent = `${auth.user.name} (${auth.user.role})`;
  hideLogin();
  boot();
} else {
  showLogin();
}
</script>
</body>
</html>
