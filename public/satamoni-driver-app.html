<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>try{if(localStorage.getItem("satamoni-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ستاموني — شاشة السائق</title>
<style>
  :root {
    --bg: #FFFFFF; --bg-alt: #F4F1EA; --card: #FFFFFF; --border: #E3DDD0; --ink: #221E17; --faint: #6E6459; --red: #C22A24; --gold: #A87C1F; --gold-bright: #8A5F16; --green: #2F7A3D; --line: #E7E1D5; --err: #B3261E;
  }
  :root[data-theme="dark"] {
    --bg: #0E0E10; --bg-alt: #18181B; --card: #1D1D20; --border: #2E2C27; --ink: #F4EFE4; --faint: #9C948A; --red: #C22A24; --gold: #CBA135; --gold-bright: #E8C468; --green: #3FA34D; --line: #2A2A2E; --err: #F08A83;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 15px; }
  #topbar { height: 56px; background: var(--bg-alt); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; position: sticky; top: 0; z-index: 10; }
  #topbar .brand { font-weight: 800; color: var(--gold-bright); font-size: 16px; }
  #userInfo { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  #logoutBtn { background: transparent; border: 1px solid var(--line); color: var(--faint); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

  #tabs { display: flex; gap: 6px; padding: 12px 14px 0; }
  .tabbtn { flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--faint); cursor: pointer; font-weight: 800; font-size: 13px; }
  .tabbtn.active { background: var(--red); color: #fff; border-color: var(--red); }
  .panel { display: none; padding: 14px; }
  .panel.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card .orderNum { font-weight: 800; color: var(--gold-bright); font-size: 16px; }
  .card .field { font-size: 13px; color: var(--faint); margin-bottom: 4px; }
  .card .field b { color: var(--ink); font-weight: 700; }
  .pill { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .pill.assigned { background: rgba(203,161,53,.2); color: var(--gold-bright); }
  .pill.out { background: rgba(203,161,53,.3); color: var(--gold-bright); }
  .pill.delivered { background: rgba(63,163,77,.2); color: var(--green); }
  .pill.failed { background: rgba(194,42,36,.2); color: var(--err); }

  .btnRow { display: flex; gap: 8px; margin-top: 10px; }
  .actionBtn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .actionBtn.primary { background: var(--red); color: #fff; }
  .actionBtn.success { background: var(--green); color: #fff; }
  .actionBtn.warn { background: transparent; border: 1px solid var(--line); color: var(--faint); }

  .inlineForm { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: none; }
  .inlineForm.show { display: block; }
  .inlineForm input, .inlineForm select { width: 100%; background: var(--bg-alt); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 8px; }
  .err { color: var(--err); font-size: 12px; margin-top: 6px; }
  .empty { text-align: center; color: var(--faint); padding: 40px 20px; }

  #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 60; }
  #loginOverlay.hidden { display: none; }
  #loginBox { width: 300px; text-align: center; }
  #loginBox h1 { color: var(--gold-bright); margin-bottom: 24px; font-size: 20px; }
  #loginBox input { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 14px; font-size: 15px; margin-bottom: 10px; }
  #loginBox button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 6px; }
  #loginErr { color: var(--err); font-size: 12px; margin-top: 10px; min-height: 16px; }
  #accessDenied { padding: 60px 20px; text-align: center; color: var(--faint); }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">🛵 السائق</div>
  <div id="userInfo">
    <span id="userName"></span>
    <button id="themeToggleBtn" title="الوضع الليلي" style="background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700">🌙</button>
    <button id="logoutBtn">خروج</button>
  </div>
</div>

<div id="loginOverlay">
  <div id="loginBox">
    <h1>🛵 تسجيل دخول السائق</h1>
    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" />
    <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button id="loginBtn">دخول</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="mainWrap" style="display:none">
  <div id="tabs">
    <div class="tabbtn active" data-tab="deliveries">طلباتي</div>
    <div class="tabbtn" data-tab="settlements">تسوياتي</div>
  </div>

  <div class="panel active" id="panel-deliveries">
    <div id="deliveriesList"></div>
  </div>

  <div class="panel" id="panel-settlements">
    <div id="settlementsList"></div>
  </div>
</div>

<div id="accessDenied" style="display:none">الشاشة دي للسائقين بس.</div>

<script>
const API_BASE_URL = window.SATAMONI_API_URL || (location.protocol.startsWith("http") ? "" : "http://localhost:4000");
const DISPATCH_LABELS = { ASSIGNED: "متعيّن - جاهز للخروج", OUT_FOR_DELIVERY: "في الطريق", DELIVERED: "اتسلّم", FAILED: "فشل التسليم" };
const DISPATCH_CLASS = { ASSIGNED: "assigned", OUT_FOR_DELIVERY: "out", DELIVERED: "delivered", FAILED: "failed" };
const FAILURE_REASONS = [
  { v: "CUSTOMER_UNREACHABLE", l: "العميل مش رادّ" }, { v: "CUSTOMER_REFUSED", l: "العميل رفض الاستلام" },
  { v: "WRONG_ADDRESS", l: "العنوان غلط" }, { v: "CLOSED_LOCATION", l: "المكان مقفول" }, { v: "OTHER", l: "سبب تاني" },
];

const auth = {
  token: sessionStorage.getItem("satamoni_token") || null,
  user: JSON.parse(sessionStorage.getItem("satamoni_user") || "null"),
};
if (auth.user && auth.user.role && auth.user.role !== "driver") {
  const redirects = { cashier: "satamoni-pos.html", callcenter: "satamoni-callcenter.html" };
  location.replace(redirects[auth.user.role] || "satamoni-dispatch.html");
}

function showLogin() { document.getElementById("loginOverlay").classList.remove("hidden"); }
function hideLogin() { document.getElementById("loginOverlay").classList.add("hidden"); }
function setSession(token, user) {
  auth.token = token; auth.user = user;
  sessionStorage.setItem("satamoni_token", token);
  sessionStorage.setItem("satamoni_user", JSON.stringify(user));
  document.getElementById("userName").textContent = user.name;
}
function clearSession() {
  auth.token = null; auth.user = null;
  sessionStorage.removeItem("satamoni_token");
  sessionStorage.removeItem("satamoni_user");
}
async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(auth.token ? { Authorization: `Bearer ${auth.token}` } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401) { clearSession(); showLogin(); throw new Error("انتهت الجلسة، سجل دخول تاني"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "حصل خطأ");
  return data;
}
function money(n) { return `${Number(n).toFixed(2)} ج.م`; }

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginErr");
  errBox.textContent = "";
  try {
    const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    if (data.user.role !== "driver") {
      errBox.textContent = "الشاشة دي للسائقين بس";
      return;
    }
    setSession(data.token, data.user);
    hideLogin();
    boot();
  } catch (e) { errBox.textContent = e.message; }
};
document.getElementById("logoutBtn").onclick = () => { clearSession(); location.reload(); };

document.querySelectorAll(".tabbtn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === `panel-${btn.dataset.tab}`));
    if (btn.dataset.tab === "deliveries") loadDeliveries();
    if (btn.dataset.tab === "settlements") loadSettlements();
  };
});

async function boot() {
  document.getElementById("mainWrap").style.display = "block";
  document.getElementById("accessDenied").style.display = "none";
  await loadDeliveries();
}

function renderCard(o) {
  const card = document.createElement("div");
  card.className = "card";
  const isCod = o.payment_kind === "cash" && o.payment_status === "pending_collection";
  card.innerHTML = `
    <div class="top">
      <span class="orderNum">#${o.id}</span>
      <span class="pill ${DISPATCH_CLASS[o.dispatch_status] || ""}">${DISPATCH_LABELS[o.dispatch_status] || o.dispatch_status}</span>
    </div>
    <div class="field">العميل: <b>${o.customer_name || "—"}</b></div>
    <div class="field">التليفون: <b>${o.customer_phone || "—"}</b></div>
    <div class="field">العنوان: <b>${o.address_details || "—"}</b>${o.delivery_area_name ? ` (${o.delivery_area_name})` : ""}</div>
    ${o.distinguishing_mark ? `<div class="field">علامة مميزة: <b>${o.distinguishing_mark}</b></div>` : ""}
    <div class="field">الدفع: <b>${o.payment_method_name || "—"}</b> ${isCod ? "(كاش عند الاستلام)" : "(محصّل بالفعل)"}</div>
    <div class="field">الإجمالي: <b>${money(o.total)}</b></div>
    <div class="err" data-err></div>
  `;

  if (o.dispatch_status === "ASSIGNED") {
    const btnRow = document.createElement("div");
    btnRow.className = "btnRow";
    btnRow.innerHTML = `<button class="actionBtn primary" data-out>خرجت للتوصيل</button>`;
    card.appendChild(btnRow);
    btnRow.querySelector("[data-out]").onclick = async (e) => {
      const btn = e.target; btn.disabled = true;
      try {
        await api(`/api/deliveries/${o.id}/out-for-delivery`, { method: "POST" });
        loadDeliveries();
      } catch (err) { card.querySelector("[data-err]").textContent = err.message; btn.disabled = false; }
    };
  } else if (o.dispatch_status === "OUT_FOR_DELIVERY") {
    const btnRow = document.createElement("div");
    btnRow.className = "btnRow";
    btnRow.innerHTML = `
      <button class="actionBtn success" data-delivered>اتسلّم ✅</button>
      <button class="actionBtn warn" data-failed>فشل التسليم</button>
    `;
    card.appendChild(btnRow);

    const deliveredForm = document.createElement("div");
    deliveredForm.className = "inlineForm";
    deliveredForm.innerHTML = isCod
      ? `<input type="number" min="0" step="0.01" placeholder="المبلغ اللي حصّلته فعليًا" data-collected-input value="${o.total}" />
         <button class="actionBtn success" data-confirm-delivered>تأكيد التسليم</button>`
      : `<button class="actionBtn success" data-confirm-delivered>تأكيد التسليم</button>`;
    card.appendChild(deliveredForm);

    const failedForm = document.createElement("div");
    failedForm.className = "inlineForm";
    failedForm.innerHTML = `
      <select data-failure-reason>
        <option value="">اختار السبب</option>
        ${FAILURE_REASONS.map(r => `<option value="${r.v}">${r.l}</option>`).join("")}
      </select>
      <button class="actionBtn warn" data-confirm-failed>تأكيد فشل التسليم</button>
    `;
    card.appendChild(failedForm);

    btnRow.querySelector("[data-delivered]").onclick = () => {
      deliveredForm.classList.toggle("show");
      failedForm.classList.remove("show");
    };
    btnRow.querySelector("[data-failed]").onclick = () => {
      failedForm.classList.toggle("show");
      deliveredForm.classList.remove("show");
    };
    deliveredForm.querySelector("[data-confirm-delivered]").onclick = async (e) => {
      const btn = e.target; btn.disabled = true;
      const collectedInput = deliveredForm.querySelector("[data-collected-input]");
      try {
        await api(`/api/deliveries/${o.id}/delivered`, {
          method: "POST",
          body: JSON.stringify(collectedInput ? { collectedAmount: Number(collectedInput.value) } : {}),
        });
        loadDeliveries();
      } catch (err) { card.querySelector("[data-err]").textContent = err.message; btn.disabled = false; }
    };
    failedForm.querySelector("[data-confirm-failed]").onclick = async (e) => {
      const btn = e.target; btn.disabled = true;
      const reason = failedForm.querySelector("[data-failure-reason]").value;
      if (!reason) { card.querySelector("[data-err]").textContent = "لازم تختار سبب"; btn.disabled = false; return; }
      try {
        await api(`/api/deliveries/${o.id}/failed`, { method: "POST", body: JSON.stringify({ reason }) });
        loadDeliveries();
      } catch (err) { card.querySelector("[data-err]").textContent = err.message; btn.disabled = false; }
    };
  }
  return card;
}

async function loadDeliveries() {
  const list = document.getElementById("deliveriesList");
  list.innerHTML = `<div class="empty">...جاري التحميل</div>`;
  try {
    const orders = await api("/api/deliveries/mine");
    if (orders.length === 0) {
      list.innerHTML = `<div class="empty">مفيش طلبات مُسندة لك دلوقتي</div>`;
      return;
    }
    list.innerHTML = "";
    orders.forEach(o => list.appendChild(renderCard(o)));
  } catch (e) {
    list.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

async function loadSettlements() {
  const list = document.getElementById("settlementsList");
  list.innerHTML = `<div class="empty">...جاري التحميل</div>`;
  try {
    const settlements = await api("/api/driver-settlements");
    if (settlements.length === 0) {
      list.innerHTML = `<div class="empty">لسه مفيش تسويات مسجّلة</div>`;
      return;
    }
    list.innerHTML = settlements.map(s => `
      <div class="card">
        <div class="top">
          <span style="font-weight:800">${new Date(s.settled_at).toLocaleDateString("ar-EG")}</span>
          <span class="pill ${s.variance_status === "NONE" ? "delivered" : "failed"}">${s.variance_status}</span>
        </div>
        <div class="field">عدد الطلبات: <b>${s.order_count}</b></div>
        <div class="field">المتوقع تسليمه: <b>${money(s.expected_handover)}</b></div>
        <div class="field">اللي سلّمته فعليًا: <b>${money(s.actual_handover)}</b></div>
        <div class="field">الفرق: <b>${money(s.handover_variance)}</b></div>
      </div>
    `).join("");
  } catch (e) {
    list.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

if (auth.token && auth.user && auth.user.role === "driver") {
  document.getElementById("userName").textContent = auth.user.name;
  hideLogin();
  boot();
} else if (auth.token && auth.user) {
  document.getElementById("accessDenied").style.display = "block";
} else {
  showLogin();
}
</script>
<script src="/js/theme.js"></script>
</body>
</html>
