<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ساتاموني — السنتر كيتشن</title>
<style>
  :root {
    --bg: #0E0E10; --bg-alt: #18181B; --card: #1D1D20; --border: #2E2C27;
    --ink: #F4EFE4; --faint: #9C948A; --red: #C22A24; --gold: #CBA135;
    --gold-bright: #E8C468; --green: #3FA34D; --line: #2A2A2E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 15px; }
  #topbar { height: 56px; background: var(--bg-alt); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  #topbar .brand { font-weight: 800; color: var(--gold-bright); font-size: 17px; }
  #userInfo { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
  #logoutBtn { background: transparent; border: 1px solid var(--line); color: var(--faint); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

  #main { max-width: 950px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 18px; color: var(--gold-bright); margin: 24px 0 12px; }
  h1:first-child { margin-top: 0; }
  h2 { font-size: 14px; color: var(--faint); margin: 18px 0 8px; }

  #tabs { display: flex; gap: 6px; margin: 16px 0; flex-wrap: wrap; }
  .tabbtn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); color: var(--faint); cursor: pointer; font-weight: 700; font-size: 13px; }
  .tabbtn.active { background: var(--red); color: #fff; border-color: var(--red); }
  .panel { display: none; }
  .panel.active { display: block; }

  .formbox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .formbox .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .formbox input, .formbox select, .formbox textarea { flex: 1; min-width: 130px; background: var(--bg-alt); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: inherit; }
  .formbox label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); flex: 0; white-space: nowrap; }
  .formbox label.chk input { flex: 0; width: auto; }
  .formbox button { padding: 10px 18px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; cursor: pointer; font-size: 13px; }
  .err { color: #F08A83; font-size: 12px; margin-top: 6px; }
  .ok { color: var(--green); font-size: 12px; margin-top: 6px; }

  .pickrow { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .pickrow select { flex: 2; }
  .pickrow input { flex: 1; }
  .pickrow button { flex: 0; padding: 8px 10px; border: 1px solid var(--line); background: transparent; color: #F08A83; border-radius: 6px; cursor: pointer; }
  .addrow-link { background: none; border: 1px dashed var(--line); color: var(--gold-bright); cursor: pointer; font-size: 12px; padding: 8px; border-radius: 6px; width: 100%; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 9px 10px; text-align: right; font-size: 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--faint); font-weight: 700; background: var(--bg-alt); }
  tr:last-child td { border-bottom: none; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge.pending { background: rgba(203,161,53,.15); color: var(--gold-bright); }
  .badge.fulfilled { background: rgba(63,163,77,.15); color: var(--green); }
  .badge.cancelled { background: rgba(194,42,36,.15); color: #F08A83; }
  .linkbtn { background: none; border: none; color: var(--gold-bright); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }
  .linkbtn.danger { color: #F08A83; }
  .fulfillbox { background: var(--bg-alt); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 6px; }

  #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 60; }
  #loginOverlay.hidden { display: none; }
  #loginBox { width: 320px; text-align: center; }
  #loginBox h1 { color: var(--gold-bright); margin-bottom: 24px; }
  #loginBox input { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 10px; }
  #loginBox button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--red); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 6px; }
  #loginErr { color: #F08A83; font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">🏭 ساتاموني — السنتر كيتشن</div>
  <div id="userInfo">
    <span id="userName"></span>
    <button id="logoutBtn">خروج</button>
  </div>
</div>

<div id="loginOverlay">
  <div id="loginBox">
    <h1>🏭 تسجيل الدخول</h1>
    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" />
    <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button id="loginBtn">دخول</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="main" style="display:none">
  <div id="tabs">
    <div class="tabbtn active" data-tab="order">اطلب من السنتر كيتشن</div>
    <div class="tabbtn" data-tab="fulfill" style="display:none">تنفيذ الطلبيات</div>
    <div class="tabbtn" data-tab="manufacturing" style="display:none">التصنيع</div>
  </div>

  <!-- طلب من السنتر كيتشن -->
  <div class="panel active" id="panel-order">
    <h1>طلبية جديدة</h1>
    <div class="formbox">
      <div id="orderRows"></div>
      <button class="addrow-link" id="addOrderRow">+ صنف تاني</button>
      <div class="row"><textarea id="orderNotes" placeholder="ملاحظات (اختياري)" rows="2"></textarea></div>
      <button id="orderSubmit">إرسال الطلبية</button>
      <div class="err" id="orderErr"></div>
    </div>

    <h1>طلبياتي</h1>
    <table><thead><tr><th>التاريخ</th><th>الأصناف</th><th>الحالة</th><th></th></tr></thead><tbody id="myOrdersBody"></tbody></table>
  </div>

  <!-- تنفيذ طلبيات الفروع -->
  <div class="panel" id="panel-fulfill">
    <h1>الطلبيات المعلّقة</h1>
    <div id="pendingOrdersList"></div>
  </div>

  <!-- التصنيع -->
  <div class="panel" id="panel-manufacturing">
    <h1>إضافة مكوّن جديد للكتالوج</h1>
    <div class="formbox">
      <div class="row">
        <input id="newItemName" placeholder="اسم المكوّن" />
        <input id="newItemUnit" placeholder="وحدة القياس (كجم/لتر/قطعة)" />
        <select id="newItemType">
          <option value="raw">خام (بيتشترى)</option>
          <option value="manufactured">مصنّع (بيتعمل في السنتر كيتشن)</option>
        </select>
        <button id="newItemSubmit">إضافة</button>
      </div>
      <div class="err" id="newItemErr"></div>
    </div>

    <h1>تسجيل عملية تصنيع</h1>
    <div class="formbox">
      <div class="row">
        <select id="produceItem"></select>
        <input id="produceQty" type="number" placeholder="الكمية المنتَجة" />
        <button id="produceSubmit">سجّل التصنيع</button>
      </div>
      <div id="produceErr" class="err"></div>
      <div id="produceOk" class="ok"></div>
    </div>

    <h1>وصفة التصنيع</h1>
    <div class="formbox">
      <div class="row"><select id="recipeItem"></select></div>
      <div id="recipeRows"></div>
      <button class="addrow-link" id="addRecipeRow">+ مكوّن تاني</button>
      <button id="recipeSave">حفظ الوصفة</button>
      <div class="err" id="recipeErr"></div>
    </div>

    <h1>مخزون السنتر كيتشن</h1>
    <table><thead><tr><th>المكوّن</th><th>الرصيد</th></tr></thead><tbody id="kitchenStockBody"></tbody></table>
  </div>
</div>

<div id="accessDenied" style="display:none">مفيش صلاحية على الحساب ده.</div>

<script>
const API_BASE_URL = window.SATAMONI_API_URL || (location.protocol.startsWith("http") ? "" : "http://localhost:4000");
const allowedRoles = ["admin", "branch_manager", "cashier"];

const auth = {
  token: sessionStorage.getItem("satamoni_token") || null,
  user: JSON.parse(sessionStorage.getItem("satamoni_user") || "null"),
};

let inventoryItems = [];

function showLogin() { document.getElementById("loginOverlay").classList.remove("hidden"); }
function hideLogin() { document.getElementById("loginOverlay").classList.add("hidden"); }
function setSession(token, user) {
  auth.token = token; auth.user = user;
  sessionStorage.setItem("satamoni_token", token);
  sessionStorage.setItem("satamoni_user", JSON.stringify(user));
  document.getElementById("userName").textContent = `${user.name} (${user.role})`;
}
function clearSession() {
  auth.token = null; auth.user = null;
  sessionStorage.removeItem("satamoni_token");
  sessionStorage.removeItem("satamoni_user");
}
async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(auth.token ? { Authorization: `Bearer ${auth.token}` } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401) { clearSession(); showLogin(); throw new Error("انتهت الجلسة، سجل دخول تاني"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "حصل خطأ");
  return data;
}

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginErr");
  errBox.textContent = "";
  try {
    const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    if (!allowedRoles.includes(data.user.role)) {
      setSession(data.token, data.user);
      hideLogin();
      document.getElementById("accessDenied").style.display = "block";
      return;
    }
    setSession(data.token, data.user);
    hideLogin();
    boot();
  } catch (e) {
    errBox.textContent = e.message;
  }
};
document.getElementById("logoutBtn").onclick = () => { clearSession(); location.reload(); };

document.querySelectorAll(".tabbtn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === `panel-${btn.dataset.tab}`));
  };
});

function money(n) { return `${Number(n).toFixed(2)} ج.م`; }
function isKitchenStaff() { return auth.user.role === "admin" || auth.user.isCentralKitchen; }

async function boot() {
  document.getElementById("main").style.display = "block";
  document.getElementById("accessDenied").style.display = "none";

  inventoryItems = await api("/api/inventory/items");

  addOrderRow();
  await loadMyOrders();

  if (isKitchenStaff()) {
    document.querySelector('[data-tab="fulfill"]').style.display = "block";
    document.querySelector('[data-tab="manufacturing"]').style.display = "block";
    await loadPendingOrders();
    populateProduceAndRecipeSelects();
    addRecipeRow();
    await loadKitchenStock();
  }
}

function itemOptions(filterType) {
  const items = filterType ? inventoryItems.filter(i => i.item_type === filterType) : inventoryItems;
  return items.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join("");
}

// ---------------- طلبية فرع ----------------
function addOrderRow() {
  const wrap = document.getElementById("orderRows");
  const row = document.createElement("div");
  row.className = "pickrow";
  row.innerHTML = `
    <select class="ord-item">${itemOptions()}</select>
    <input class="ord-qty" type="number" placeholder="الكمية" />
    <button type="button" class="ord-remove">×</button>
  `;
  row.querySelector(".ord-remove").onclick = () => row.remove();
  wrap.appendChild(row);
}
document.getElementById("addOrderRow").onclick = addOrderRow;

document.getElementById("orderSubmit").onclick = async () => {
  const errBox = document.getElementById("orderErr");
  errBox.textContent = "";
  const rows = [...document.querySelectorAll("#orderRows .pickrow")];
  const items = rows.map(r => ({
    inventoryItemId: r.querySelector(".ord-item").value,
    quantityRequested: Number(r.querySelector(".ord-qty").value),
  })).filter(it => it.quantityRequested > 0);
  if (items.length === 0) { errBox.textContent = "لازم تحدد صنف وكمية على الأقل"; return; }
  try {
    await api("/api/kitchen-orders", {
      method: "POST",
      body: JSON.stringify({ branchId: auth.user.branchId, items, notes: document.getElementById("orderNotes").value.trim() || null }),
    });
    document.getElementById("orderRows").innerHTML = "";
    addOrderRow();
    document.getElementById("orderNotes").value = "";
    await loadMyOrders();
    if (isKitchenStaff()) await loadPendingOrders();
  } catch (e) { errBox.textContent = e.message; }
};

async function loadMyOrders() {
  const orders = await api(`/api/kitchen-orders?branchId=${auth.user.branchId}`);
  const statusLabels = { pending: "معلّقة", fulfilled: "اتنفذت", cancelled: "ملغية" };
  document.getElementById("myOrdersBody").innerHTML = orders.map(o => `
    <tr>
      <td>${o.business_date.slice(0, 10)}</td>
      <td>${o.items.map(it => `${it.name} × ${it.quantity_requested}`).join("، ")}</td>
      <td><span class="badge ${o.status}">${statusLabels[o.status]}</span></td>
      <td>${o.status === "pending" ? `<button class="linkbtn danger" data-cancel="${o.id}">إلغاء</button>` : ""}</td>
    </tr>
  `).join("") || `<tr><td colspan="4">مفيش طلبيات لسه</td></tr>`;
  document.querySelectorAll("[data-cancel]").forEach(btn => {
    btn.onclick = async () => {
      await api(`/api/kitchen-orders/${btn.dataset.cancel}`, { method: "PATCH", body: JSON.stringify({ status: "cancelled" }) });
      await loadMyOrders();
      if (isKitchenStaff()) await loadPendingOrders();
    };
  });
}

// ---------------- تنفيذ الطلبيات ----------------
async function loadPendingOrders() {
  const orders = await api("/api/kitchen-orders?status=pending");
  const wrap = document.getElementById("pendingOrdersList");
  wrap.innerHTML = orders.length ? orders.map(o => `
    <div class="formbox" data-order="${o.id}" data-branch="${o.branch_id}">
      <div><b>${o.branch_name}</b> — ${o.business_date.slice(0, 10)}${o.notes ? ` — ${o.notes}` : ""}</div>
      <div style="font-size:12px;color:var(--faint);margin:6px 0">${o.items.map(it => `${it.name}: مطلوب ${it.quantity_requested} ${it.unit}`).join("، ")}</div>
      <button class="linkbtn" data-startfulfill="${o.id}">نفّذ الطلبية</button>
      <div class="fulfillbox" style="display:none" data-fulfillbox="${o.id}"></div>
    </div>
  `).join("") : `<div style="color:var(--faint);font-size:13px">مفيش طلبيات معلّقة</div>`;

  document.querySelectorAll("[data-startfulfill]").forEach(btn => {
    btn.onclick = () => {
      const orderId = btn.dataset.startfulfill;
      const card = document.querySelector(`[data-order="${orderId}"]`);
      const order = orders.find(o => String(o.id) === orderId);
      const box = card.querySelector(`[data-fulfillbox="${orderId}"]`);
      box.style.display = "block";
      box.innerHTML = order.items.map(it => `
        <div class="pickrow">
          <span style="flex:2">${it.name} (${it.unit})</span>
          <input class="fulfill-qty" type="number" value="${it.quantity_requested}" data-item="${it.inventory_item_id}" />
        </div>
      `).join("") + `<button data-confirmfulfill="${orderId}" data-branch="${order.branch_id}">تأكيد التنفيذ</button><div class="err" data-fulfillerr="${orderId}"></div>`;

      box.querySelector(`[data-confirmfulfill="${orderId}"]`).onclick = async () => {
        const errBox = box.querySelector(`[data-fulfillerr="${orderId}"]`);
        errBox.textContent = "";
        const items = [...box.querySelectorAll(".fulfill-qty")]
          .map(inp => ({ inventoryItemId: inp.dataset.item, quantity: Number(inp.value) }))
          .filter(it => it.quantity > 0);
        if (items.length === 0) { errBox.textContent = "لازم كمية أكبر من صفر على الأقل لصنف واحد"; return; }
        try {
          await api("/api/kitchen-transfers/itemized", {
            method: "POST",
            body: JSON.stringify({
              fromBranchId: auth.user.branchId,
              toBranchId: order.branch_id,
              businessDate: new Date().toISOString().slice(0, 10),
              items,
              kitchenOrderId: orderId,
            }),
          });
          await loadPendingOrders();
          await loadKitchenStock();
        } catch (e) { errBox.textContent = e.message; }
      };
    };
  });
}

// ---------------- التصنيع ----------------
document.getElementById("newItemSubmit").onclick = async () => {
  const errBox = document.getElementById("newItemErr");
  errBox.textContent = "";
  try {
    await api("/api/inventory/items", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("newItemName").value.trim(),
        unit: document.getElementById("newItemUnit").value.trim(),
        itemType: document.getElementById("newItemType").value,
      }),
    });
    document.getElementById("newItemName").value = "";
    document.getElementById("newItemUnit").value = "";
    inventoryItems = await api("/api/inventory/items");
    populateProduceAndRecipeSelects();
  } catch (e) { errBox.textContent = e.message; }
};

function populateProduceAndRecipeSelects() {
  const manufactured = itemOptions("manufactured");
  document.getElementById("produceItem").innerHTML = manufactured || `<option value="">لسه مفيش أصناف مصنّعة</option>`;
  document.getElementById("recipeItem").innerHTML = manufactured || `<option value="">لسه مفيش أصناف مصنّعة</option>`;
  document.getElementById("recipeItem").onchange = loadRecipeForSelectedItem;
  loadRecipeForSelectedItem();
}

document.getElementById("produceSubmit").onclick = async () => {
  const errBox = document.getElementById("produceErr");
  const okBox = document.getElementById("produceOk");
  errBox.textContent = ""; okBox.textContent = "";
  try {
    await api("/api/inventory/produce", {
      method: "POST",
      body: JSON.stringify({
        branchId: auth.user.branchId,
        outputItemId: document.getElementById("produceItem").value,
        quantityProduced: Number(document.getElementById("produceQty").value),
      }),
    });
    okBox.textContent = "تم تسجيل التصنيع وتحديث المخزون";
    document.getElementById("produceQty").value = "";
    await loadKitchenStock();
  } catch (e) { errBox.textContent = e.message; }
};

function addRecipeRow(inputItemId, qty) {
  const wrap = document.getElementById("recipeRows");
  const row = document.createElement("div");
  row.className = "pickrow";
  row.innerHTML = `
    <select class="rec-item">${itemOptions()}</select>
    <input class="rec-qty" type="number" placeholder="الكمية لكل وحدة ناتج" value="${qty || ""}" />
    <button type="button" class="rec-remove">×</button>
  `;
  if (inputItemId) row.querySelector(".rec-item").value = inputItemId;
  row.querySelector(".rec-remove").onclick = () => row.remove();
  wrap.appendChild(row);
}
document.getElementById("addRecipeRow").onclick = () => addRecipeRow();

async function loadRecipeForSelectedItem() {
  const itemId = document.getElementById("recipeItem").value;
  document.getElementById("recipeRows").innerHTML = "";
  if (!itemId) { addRecipeRow(); return; }
  const recipe = await api(`/api/inventory/manufacturing-recipe/${itemId}`);
  if (recipe.length === 0) { addRecipeRow(); return; }
  recipe.forEach(r => addRecipeRow(r.input_item_id, r.quantity_per_unit));
}

document.getElementById("recipeSave").onclick = async () => {
  const errBox = document.getElementById("recipeErr");
  errBox.textContent = "";
  const itemId = document.getElementById("recipeItem").value;
  if (!itemId) { errBox.textContent = "اختار الصنف المصنّع الأول"; return; }
  const rows = [...document.querySelectorAll("#recipeRows .pickrow")];
  const ingredients = rows.map(r => ({
    inputItemId: r.querySelector(".rec-item").value,
    quantityPerUnit: Number(r.querySelector(".rec-qty").value),
  })).filter(i => i.quantityPerUnit > 0);
  try {
    await api(`/api/inventory/manufacturing-recipe/${itemId}`, { method: "PUT", body: JSON.stringify({ ingredients }) });
    errBox.textContent = "";
  } catch (e) { errBox.textContent = e.message; }
};

async function loadKitchenStock() {
  const stock = await api(`/api/inventory/stock?branchId=${auth.user.branchId}`);
  document.getElementById("kitchenStockBody").innerHTML = stock.map(s => `
    <tr><td>${s.name}</td><td>${s.quantity} ${s.unit}</td></tr>
  `).join("") || `<tr><td colspan="2">مفيش رصيد مسجل لسه</td></tr>`;
}

if (auth.token && auth.user) {
  document.getElementById("userName").textContent = `${auth.user.name} (${auth.user.role})`;
  hideLogin();
  if (allowedRoles.includes(auth.user.role)) boot();
  else document.getElementById("accessDenied").style.display = "block";
} else {
  showLogin();
}
</script>
</body>
</html>
