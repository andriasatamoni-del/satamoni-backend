<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>try{if(localStorage.getItem("satamoni-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ستاموني — نظام إدارة المطعم</title>
<style>
  :root {
    --bg: #FFFFFF; --bg-alt: #F4F1EA; --card: #FFFFFF; --border: #E3DDD0; --ink: #221E17; --faint: #6E6459; --red: #C22A24; --gold: #A87C1F; --gold-bright: #8A5F16; --green: #2F7A3D; --line: #E7E1D5; --err: #B3261E;
  }
  :root[data-theme="dark"] {
    --bg: #0E0E10; --bg-alt: #18181B; --card: #1D1D20; --border: #2E2C27; --ink: #F4EFE4; --faint: #9C948A; --red: #C22A24; --gold: #CBA135; --gold-bright: #E8C468; --green: #3FA34D; --line: #2A2A2E; --err: #F08A83;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; min-height: 100vh; }

  /* المرحلة 8.33: شريط علوي أزرق (على غرار السيستم القديم) - في الوضع النهاري بس؛ الوضع الليلي زي ما كان */
  #topbar {
    height: 56px; background: var(--bg-alt); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; padding: 0 16px;
  }
  #topbar .brand { font-weight: 800; color: var(--gold-bright); font-size: 18px; }
  :root:not([data-theme="dark"]) #topbar {
    background: #1B5FA8;
    border-bottom: 1px solid #164E8A;
    --ink: #FFFFFF;
    --faint: rgba(255,255,255,.82);
    --line: rgba(255,255,255,.45);
  }
  :root:not([data-theme="dark"]) #topbar .brand { color: #FFFFFF; }
  #themeToggleWrap { position: absolute; left: 16px; }

  #wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 40px; position: relative; }
  .sub { text-align: center; color: var(--faint); font-size: 13px; margin-bottom: 24px; }

  #tilesWrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: #fff; border-radius: 14px; padding: 22px 12px; text-decoration: none; text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: transform .1s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card .icon { font-size: 32px; }
  .card .title { font-weight: 800; font-size: 14px; }
  .card .desc { font-size: 11px; opacity: .88; }
  footer { text-align: center; color: var(--faint); font-size: 11px; margin-top: 30px; }
</style>
</head>
<body>
<div id="topbar">
  <div class="brand">🍕 ستاموني — نظام إدارة المطعم</div>
  <div id="themeToggleWrap"><button id="themeToggleBtn" title="الوضع الليلي" style="background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700">🌙</button></div>
</div>
<div id="wrap">
  <div class="sub">اختار الشاشة اللي هتجربها</div>

  <div id="tilesWrap"></div>

  <footer>سجّل دخولك بالحساب اللي عملته وقت الإعداد (ADMIN_EMAIL)</footer>
</div>
<script>
  // المرحلة 8.23: كان بس الكاشير والكول سنتر بيتحوّلوا تلقائيًا لشاشتهم - أي دور تاني (سائق، موظف
  // بحساب دخول ذاتي) كان بيشوف قايمة الشاشات كاملة (تشمل شاشات أدمن/محاسبة) من غير أي داعي، حتى لو
  // مش هيقدر يفتحها فعليًا (كل شاشة بتتحقق من الصلاحية بنفسها) - إحراج وتشويش من غير فايدة
  const _u = JSON.parse(sessionStorage.getItem("satamoni_user") || "null");
  const roleRedirects = {
    cashier: "satamoni-pos.html",
    callcenter: "satamoni-callcenter.html",
    driver: "satamoni-driver-app.html",
    employee: "satamoni-employee-self.html",
  };
  const redirectTarget = _u && roleRedirects[_u.role];
  if (redirectTarget) location.replace(redirectTarget);

  // المرحلة 8.17: البطاقات بقت مخزّنة في الداتابيز (home_tiles) بدل ما تكون ثابتة هنا - المالك يقدر
  // يغيّر اسم/ترتيب أي بطاقة من لوحة الأدمن (satamoni-admin.html) من غير ما يحتاج تعديل كود
  const API_BASE_URL = window.SATAMONI_API_URL || (location.protocol.startsWith("http") ? "" : "http://localhost:4000");
  // المرحلة 8.33: كل بطاقة بتاخد لون مميز بالتدوير على باليت ثابتة (زي شكل تايلز السيستم القديم
  // الملوّنة) - بدل ما تكون كل البطاقات بلون واحد؛ الألوان مش مخزّنة في الداتابيز، بس متسلسلة حسب ترتيب العرض
  const TILE_PALETTE = ["#178A7A", "#D97B1F", "#6A3FA0", "#1B5FA8", "#C22A24", "#2F7A3D", "#A87C1F", "#B0479A"];
  if (!redirectTarget) fetch(`${API_BASE_URL}/api/home-tiles`)
    .then((r) => r.json())
    .then((tiles) => {
      document.getElementById("tilesWrap").innerHTML = tiles.map((t, i) => `
        <a class="card" href="${t.href}" style="background:${TILE_PALETTE[i % TILE_PALETTE.length]}">
          <span class="icon">${t.icon}</span>
          <div class="title">${t.title}</div>
          ${t.description ? `<div class="desc">${t.description}</div>` : ""}
        </a>
      `).join("");
    })
    .catch(() => {
      document.getElementById("tilesWrap").innerHTML = `<div style="text-align:center;color:var(--faint);font-size:13px">تعذر تحميل قايمة الشاشات - تأكد من الاتصال بالسيرفر</div>`;
    });
</script>
<script src="/js/theme.js"></script>
</body>
</html>
