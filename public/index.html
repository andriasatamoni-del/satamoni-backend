<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ستاموني — نظام إدارة المطعم</title>
<style>
  :root {
    --bg: #0E0E10; --bg-alt: #18181B; --card: #1D1D20; --border: #2E2C27;
    --ink: #F4EFE4; --faint: #9C948A; --red: #C22A24; --gold: #CBA135;
    --gold-bright: #E8C468; --green: #3FA34D; --line: #2A2A2E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; min-height: 100vh; }
  #wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
  h1 { color: var(--gold-bright); font-size: 24px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--faint); font-size: 13px; margin-bottom: 32px; }
  .card {
    display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; text-decoration: none; color: var(--ink);
  }
  .card:hover { border-color: var(--gold); }
  .card .icon { font-size: 26px; }
  .card .title { font-weight: 800; font-size: 15px; }
  .card .desc { font-size: 12px; color: var(--faint); margin-top: 2px; }
  footer { text-align: center; color: var(--faint); font-size: 11px; margin-top: 30px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🍕 ستاموني</h1>
  <div class="sub">نظام إدارة المطعم — اختار الشاشة اللي هتجربها</div>

  <div id="tilesWrap"></div>

  <footer>سجّل دخولك بالحساب اللي عملته وقت الإعداد (ADMIN_EMAIL)</footer>
</div>
<script>
  const _u = JSON.parse(sessionStorage.getItem("satamoni_user") || "null");
  if (_u && _u.role === "cashier") location.replace("satamoni-pos.html");
  if (_u && _u.role === "callcenter") location.replace("satamoni-callcenter.html");

  // المرحلة 8.17: البطاقات بقت مخزّنة في الداتابيز (home_tiles) بدل ما تكون ثابتة هنا - المالك يقدر
  // يغيّر اسم/ترتيب أي بطاقة من لوحة الأدمن (satamoni-admin.html) من غير ما يحتاج تعديل كود
  const API_BASE_URL = window.SATAMONI_API_URL || (location.protocol.startsWith("http") ? "" : "http://localhost:4000");
  fetch(`${API_BASE_URL}/api/home-tiles`)
    .then((r) => r.json())
    .then((tiles) => {
      document.getElementById("tilesWrap").innerHTML = tiles.map((t) => `
        <a class="card" href="${t.href}">
          <span class="icon">${t.icon}</span>
          <div><div class="title">${t.title}</div><div class="desc">${t.description}</div></div>
        </a>
      `).join("");
    })
    .catch(() => {
      document.getElementById("tilesWrap").innerHTML = `<div style="text-align:center;color:var(--faint);font-size:13px">تعذر تحميل قايمة الشاشات - تأكد من الاتصال بالسيرفر</div>`;
    });
</script>
</body>
</html>
